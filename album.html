// Seleciona todos os cards (.holo-card e .commum-card)

const cards = document.querySelectorAll('.holo-card, .commum-card, .legendary-card');

cards.forEach((card) => {
    card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = (y - centerY) / centerY * -15;
        const rotateY = (x - centerX) / centerX * 15;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
    });
});

// 2. Elemento pai onde os cards serão inseridos
const album = document.getElementById('album');

// 3. Função para renderizar os cards dinamicamente
function renderizarAlbum() {
    // Limpa o álbum antes de renderizar
    album.innerHTML = '';

    figurinhas.forEach((item) => {
        const classeBase = `${item.tipo}-card`;

        // Cria o elemento principal do card
        const card = document.createElement('div');
        card.className = classeBase;
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';

        // Preenche a estrutura HTML interna
        card.innerHTML = `
            <a href=${item.link}>
            <div class="${classeBase}-content">
                <div class="${classeBase}-title">${item.titulo}</div>
                <div class="${classeBase}-icon"><img src="${item.imagem}" alt="${item.titulo}"></div>
                <div class="${classeBase}-subtitle">${item.descricao}</div>
            </div>
            </a>
        `;

        // Atribui os eventos de interatividade 3D diretamente ao card criado
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -15;
            const rotateY = ((x - centerX) / centerX) * 15;

            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
        });

        // Adiciona o card ao container #album
        album.appendChild(card);
    });
}

// Executa a renderização ao carregar a página
